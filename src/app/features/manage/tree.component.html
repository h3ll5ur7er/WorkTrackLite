<div class="tree">
  <label class="visually-hidden" for="tree-filter">Filter nodes</label>
  <input
    id="tree-filter"
    class="tree__filter"
    type="search"
    placeholder="Filter…"
    [value]="filter()"
    (input)="filter.set($any($event.target).value)"
  />
  @if (hasArchived()) {
    <label class="tree__archived">
      <input type="checkbox" [checked]="showArchived()" (change)="showArchived.set($any($event.target).checked)" />
      Show archived
    </label>
  }

  <ul class="tree__list" role="list">
    <ng-container *ngTemplateOutlet="branch; context: { $implicit: roots() }" />
  </ul>

  <ng-template #branch let-nodes>
    @for (n of nodes; track n.id) {
      @if (isVisible(n.id)) {
        <li>
          <a
            class="tree__node"
            [class.tree__node--active]="selectedId() === n.id"
            [class.tree__node--archived]="n.archived"
            [routerLink]="['/manage', n.id]"
            [attr.aria-current]="selectedId() === n.id ? 'page' : null"
          >
            <span class="tree__dot" [style.background]="colorOf(n.id)" aria-hidden="true"></span>
            <span class="tree__kind">{{ n.kind }}</span>
            <span class="tree__name">{{ n.name }}</span>
            @if (n.archived) {
              <span class="tree__badge">archived</span>
            }
          </a>
          @if (childrenOf(n).length) {
            <ul role="list">
              <ng-container *ngTemplateOutlet="branch; context: { $implicit: childrenOf(n) }" />
            </ul>
          }
        </li>
      }
    }
  </ng-template>
</div>
