<div class="app" [attr.data-theme]="data.settings().theme">
  <header class="app__header">
    <div class="app__brand">
      <span class="app__logo">⏱</span>
      <strong>WorkTrackLite</strong>
    </div>

    @if (!empty()) {
      <nav class="app__nav app__nav--top">
        @for (v of views; track v) {
          <button
            class="app__nav-btn"
            [class.app__nav-btn--active]="view() === v.id"
            (click)="setView(v.id)"
          >
            <span class="app__nav-icon">{{ v.icon }}</span>
            <span class="app__nav-label">{{ v.label }}</span>
          </button>
        }
      </nav>
    }

    <div class="app__tools">
      <button
        class="btn"
        (click)="openPalette()"
        title="Command palette (Ctrl/Cmd+K)"
      >
        ⌘K
      </button>
      <a
        class="btn"
        href="worktrack-singlefile.html"
        download="worktracklite.html"
        title="Download the entire app as a single HTML file"
        aria-label="Download the entire app as a single HTML file"
        >⬇</a
      >
      <button class="btn" (click)="toggleTheme()" title="Toggle theme">
        {{ data.settings().theme === "dark" ? "☀" : "☾" }}
      </button>
    </div>
  </header>

  @if (data.ready()) {
    @if (!empty()) {
      <!-- Dashboard view -->
      @if (view() === "dashboard") {
        <main class="app__main app__main--single">
          <app-dashboard></app-dashboard>
        </main>
      }
      <!-- Schedule view -->
      @if (view() === "schedule") {
        <main class="app__main app__main--single">
          <app-schedule></app-schedule>
        </main>
      }
      <!-- Manage view (the original two-pane editor) -->
      @if (view() === "manage") {
        <main class="app__main">
          <aside class="app__sidebar">
            <div class="app__sidebar-actions">
              <button
                class="btn btn--primary"
                (click)="showAddRoot.set(!showAddRoot())"
              >
                + New top-level
              </button>
            </div>
            @if (showAddRoot()) {
              <div class="row">
                <input
                  placeholder="Name"
                  [ngModel]="newRootName()"
                  (ngModelChange)="newRootName.set($event)"
                />
                <input
                  placeholder="Kind"
                  [ngModel]="newRootKind()"
                  (ngModelChange)="newRootKind.set($event)"
                />
                <button class="btn" (click)="addRoot()">Add</button>
              </div>
            }
            <app-tree #tree></app-tree>
          </aside>
          <section class="app__content">
            <app-node-detail
              [node]="tree.selectedNode()"
              (addedChild)="tree.select($event)"
            ></app-node-detail>
          </section>
        </main>
      }
      <app-timer-bar></app-timer-bar>
      <!-- Bottom nav (mobile) -->
      <nav class="app__nav app__nav--bottom">
        @for (v of views; track v) {
          <button
            class="app__nav-btn"
            [class.app__nav-btn--active]="view() === v.id"
            (click)="setView(v.id)"
          >
            <span class="app__nav-icon">{{ v.icon }}</span>
            <span class="app__nav-label">{{ v.label }}</span>
          </button>
        }
      </nav>
    } @else {
      <app-setup></app-setup>
    }
  } @else {
    <div class="app__loading">Loading…</div>
  }

  <app-command-palette></app-command-palette>
</div>
